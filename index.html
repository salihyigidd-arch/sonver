<!DOCTYPE html>
<html lang="tr" data-theme="gold">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Y İ Ğ İ T — Dijital Tapınak & Zihin Arşivi</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@400;600;700&family=JetBrains+Mono:wght@300;400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root[data-theme="gold"] {
            --sky-dark: #02050e;
            --sky-blue: #081126;
            --main-accent: #e5b869;
            --amber-glow: rgba(229, 184, 105, 0.45);
            --card-bg: rgba(8, 17, 38, 0.75);
            --border-color: rgba(229, 184, 105, 0.3);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --input-bg: rgba(2, 5, 14, 0.9);
            --temple-fill: rgba(229, 184, 105, 0.08);
            --temple-stroke: rgba(229, 184, 105, 0.35);
        }

        :root[data-theme="obsidian"] {
            --sky-dark: #030712;
            --sky-blue: #0b1528;
            --main-accent: #38bdf8;
            --amber-glow: rgba(56, 189, 248, 0.4);
            --card-bg: rgba(11, 21, 40, 0.8);
            --border-color: rgba(56, 189, 248, 0.3);
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --input-bg: rgba(3, 7, 18, 0.9);
            --temple-fill: rgba(56, 189, 248, 0.06);
            --temple-stroke: rgba(56, 189, 248, 0.3);
        }

        :root[data-theme="forest"] {
            --sky-dark: #010a06;
            --sky-blue: #041810;
            --main-accent: #34d399;
            --amber-glow: rgba(52, 211, 153, 0.4);
            --card-bg: rgba(4, 24, 16, 0.78);
            --border-color: rgba(52, 211, 153, 0.3);
            --text-main: #ecfdf5;
            --text-muted: #6ee7b7;
            --input-bg: rgba(1, 10, 6, 0.9);
            --temple-fill: rgba(52, 211, 153, 0.06);
            --temple-stroke: rgba(52, 211, 153, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; transition: background 0.8s ease, color 0.8s ease, border-color 0.8s ease; }

        body {
            background: var(--sky-dark);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .scroll-progress {
            position: fixed;
            top: 0; right: 0;
            width: 3px; height: 0%;
            background: var(--main-accent);
            z-index: 1000;
            box-shadow: 0 0 12px var(--main-accent);
        }

        /* ATMOSFER KATMANLARI */
        .viewport-parallax {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .layer-sky {
            position: absolute; inset: 0;
            background: radial-gradient(circle at 50% 20%, var(--sky-blue) 0%, var(--sky-dark) 85%);
            z-index: 1;
        }

        #starCanvas { position: absolute; inset: 0; z-index: 2; }

        .layer-light-beams {
            position: absolute; top: -20%; left: 50%;
            transform: translateX(-50%);
            width: 120vw; height: 140vh;
            background: radial-gradient(ellipse at 50% 30%, var(--amber-glow) 0%, transparent 65%);
            filter: blur(80px); opacity: 0.6; z-index: 3;
            animation: lightPulse 10s ease-in-out infinite alternate;
        }

        @keyframes lightPulse {
            0% { opacity: 0.4; transform: translateX(-50%) scale(0.95); }
            100% { opacity: 0.75; transform: translateX(-50%) scale(1.05); }
        }

        .layer-temple-svg {
            position: absolute; bottom: 5vh; left: 50%;
            transform: translateX(-50%);
            width: 100%; max-width: 1300px; height: auto;
            z-index: 4; opacity: 0.85;
            will-change: transform;
        }

        .layer-columns-fg {
            position: absolute; bottom: -50px;
            width: 100%; height: 100vh;
            z-index: 5; display: flex;
            justify-content: space-between; padding: 0 4vw;
            pointer-events: none; opacity: 0.35;
        }

        .fg-column {
            width: 80px; height: 120%;
            background: linear-gradient(90deg, transparent 0%, var(--border-color) 40%, var(--main-accent) 50%, var(--border-color) 60%, transparent 100%);
            box-shadow: 0 0 30px var(--amber-glow);
        }

        .layer-fog {
            position: absolute; bottom: 0; left: -50%;
            width: 200%; height: 35vh;
            background: linear-gradient(to top, var(--sky-dark) 10%, var(--amber-glow) 50%, transparent 100%);
            filter: blur(60px); opacity: 0.45; z-index: 6;
            animation: fogFlow 25s linear infinite alternate;
        }

        @keyframes fogFlow {
            0% { transform: translateX(-5%); }
            100% { transform: translateX(5%); }
        }

        #goldDustCanvas { position: absolute; inset: 0; z-index: 7; }

        .container {
            position: relative; z-index: 10;
            max-width: 1280px; margin: 0 auto;
            padding: 30px 24px;
        }

        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 26px; background: var(--card-bg);
            border: 1px solid var(--border-color); border-radius: 14px;
            margin-bottom: 40px; backdrop-filter: blur(25px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }

        .status-tag { font-family: 'JetBrains Mono', monospace; font-size: 0.82rem; color: var(--main-accent); letter-spacing: 1.5px; }

        .top-controls { display: flex; gap: 12px; }

        .btn-small {
            background: transparent; border: 1px solid var(--main-accent);
            color: var(--main-accent); padding: 7px 16px; border-radius: 8px;
            font-family: 'Cinzel', serif; font-size: 0.78rem; cursor: pointer;
            transition: all 0.4s ease;
        }

        .btn-small:hover { background: var(--main-accent); color: #000; box-shadow: 0 0 20px var(--amber-glow); }

        header {
            text-align: center; padding: 40px 0 80px;
            min-height: 65vh; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
        }

        /* İKONA TIKLAYINCA MOD/TEMA DEĞİŞİR */
        .totem-container {
            width: 120px; height: 120px; margin-bottom: 24px;
            cursor: pointer; position: relative;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .totem-container:hover { transform: scale(1.15) rotate(3deg); }

        .totem-svg {
            width: 100%; height: 100%;
            filter: drop-shadow(0 0 25px var(--main-accent));
        }

        .brand-title {
            font-family: 'Cinzel Decorative', serif; font-size: 3.6rem;
            font-weight: 700; letter-spacing: 24px; color: var(--text-main);
            text-shadow: 0 0 40px var(--amber-glow); margin-left: 24px;
        }

        .brand-sub {
            font-family: 'JetBrains Mono', monospace; color: var(--main-accent);
            font-size: 0.9rem; letter-spacing: 8px; margin-top: 18px;
        }

        .reveal-on-scroll {
            opacity: 0; transform: translateY(70px) scale(0.96); filter: blur(20px);
            transition: all 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .reveal-on-scroll.revealed { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }

        .about-card {
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 20px; padding: 40px; margin-bottom: 50px;
            backdrop-filter: blur(30px); box-shadow: 0 25px 60px rgba(0,0,0,0.6);
        }

        .about-head {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px dashed var(--border-color); padding-bottom: 18px;
            margin-bottom: 22px; font-family: 'Cinzel', serif; color: var(--main-accent); font-size: 1.35rem;
        }

        .about-text { font-size: 1.05rem; line-height: 2; color: var(--text-main); white-space: pre-line; }

        /* EDİTÖR VE ÇİZİM / GÖRSEL PANELİ */
        .editor-panel {
            display: none; background: var(--card-bg);
            border: 1px solid var(--main-accent); border-radius: 18px;
            padding: 30px; margin-bottom: 50px; backdrop-filter: blur(30px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.7);
        }

        .editor-panel.active { display: block; }

        .tab-menu { display: flex; gap: 10px; margin-bottom: 20px; }

        .tab-btn {
            background: transparent; border: 1px solid var(--border-color);
            color: var(--text-muted); padding: 8px 18px; border-radius: 8px;
            cursor: pointer; font-family: 'Cinzel', serif; font-size: 0.85rem;
        }

        .tab-btn.active { background: var(--main-accent); color: #000; font-weight: bold; border-color: var(--main-accent); }

        .form-row { display: grid; grid-template-columns: 2fr 1fr; gap: 18px; margin-bottom: 18px; }

        .input-box, .select-box, .textarea-box {
            width: 100%; padding: 14px 18px; background: var(--input-bg);
            border: 1px solid var(--border-color); border-radius: 10px;
            color: #fff; font-family: inherit; outline: none; font-size: 0.95rem;
        }

        .textarea-box { min-height: 120px; resize: vertical; margin-bottom: 18px; }

        /* EL YAZISI CANVAS ALANI */
        .canvas-container {
            display: none; flex-direction: column; gap: 10px; margin-bottom: 18px;
        }

        #drawCanvas {
            width: 100%; height: 260px; background: #000;
            border: 1px solid var(--border-color); border-radius: 10px; cursor: crosshair;
        }

        .canvas-tools { display: flex; justify-content: space-between; align-items: center; }

        .btn-gold {
            background: var(--main-accent); color: #000;
            font-family: 'Cinzel', serif; font-weight: 700;
            padding: 14px 28px; border: none; border-radius: 10px;
            cursor: pointer; letter-spacing: 1px; transition: all 0.3s ease;
        }

        .btn-gold:hover { box-shadow: 0 0 30px var(--amber-glow); transform: translateY(-2px); }

        .search-filter-box { display: flex; flex-direction: column; gap: 20px; margin-bottom: 45px; }

        .search-input {
            width: 100%; padding: 18px 26px; background: var(--card-bg);
            border: 1px solid var(--border-color); border-radius: 14px;
            color: var(--text-main); font-family: inherit; font-size: 1.05rem; outline: none;
            backdrop-filter: blur(25px);
        }

        .filter-bar { display: flex; gap: 10px; flex-wrap: wrap; }

        .filter-btn {
            background: var(--card-bg); border: 1px solid var(--border-color);
            color: var(--text-muted); padding: 9px 18px; border-radius: 10px;
            font-family: 'Cinzel', serif; font-size: 0.8rem; cursor: pointer; backdrop-filter: blur(15px);
        }

        .filter-btn.active, .filter-btn:hover {
            background: var(--main-accent); color: #000; font-weight: 700;
            border-color: var(--main-accent); box-shadow: 0 0 20px var(--amber-glow);
        }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 30px; }

        .card {
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 16px; padding: 28px; display: flex; flex-direction: column;
            justify-content: space-between; backdrop-filter: blur(25px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5); position: relative; overflow: hidden;
        }

        .card-tag { font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; color: var(--main-accent); text-transform: uppercase; margin-bottom: 10px; letter-spacing: 1.5px; }
        .card-title { font-family: 'Cinzel', serif; font-size: 1.25rem; color: var(--text-main); margin-bottom: 12px; }
        .card-body { font-size: 0.96rem; color: var(--text-muted); line-height: 1.75; margin-bottom: 20px; white-space: pre-line; }
        
        /* KART İÇİ FOTOĞRAF VE ÇİZİM UYUMU */
        .card-img {
            width: 100%; height: auto; max-height: 250px; object-fit: cover;
            border-radius: 10px; border: 1px solid var(--border-color);
            margin-bottom: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .card-foot {
            display: flex; justify-content: space-between; align-items: center;
            border-top: 1px solid var(--border-color); padding-top: 14px;
            font-size: 0.82rem; color: var(--text-muted);
        }

        .btn-del { background: transparent; border: none; color: #ef4444; cursor: pointer; font-size: 0.82rem; }

        footer {
            text-align: center; margin-top: 90px; padding: 40px 0;
            border-top: 1px solid var(--border-color); font-family: 'Cinzel', serif;
            color: var(--text-muted); font-size: 0.9rem; letter-spacing: 3px;
        }
    </style>
</head>
<body>

    <div class="scroll-progress" id="scrollProgress"></div>

    <div class="viewport-parallax">
        <div class="layer-sky"></div>
        <canvas id="starCanvas"></canvas>
        <div class="layer-light-beams"></div>

        <!-- ANTİK DİJİTAL TAPINAK SVG -->
        <svg class="layer-temple-svg" id="templeSvg" viewBox="0 0 1200 450" fill="none" xmlns="http://www.w3.org/2000/svg">

        <div class="layer-columns-fg" id="fgColumns">

        <div class="layer-fog"></div>

            theme: 'gold',
            name: 'ZARAFET & ESTETİK (CERVUS)',
            svg: `<path d="M48 42C44 32 32 20 20 15C22 23 28 29 34 32C28 26 22 24 14 24C20 31 28 35 38 38C30 38 24 39 18 42C26 44 36 44 45 44" stroke="var(--main-accent)" stroke-width="2.5" stroke-linecap="round"/><path d="M52 42C56 32 68 20 80 15C78 23 72 29 66 32C72 26 78 24 86 24C80 31 72 35 62 38C70 38 76 39 82 42C74 44 64 44 55 44" stroke="var(--main-accent)" stroke-width="2.5" stroke-linecap="round"/><polygon points="50,45 38,58 43,82 50,90 57,82 62,58" stroke="var(--main-accent)" stroke-width="2" fill="var(--amber-glow)"/>`
        },
        {
            theme: 'obsidian',
            name: 'BİLGELİK & FELSEFE (ATHENE)',
            svg: `<circle cx="50" cy="50" r="35" stroke="var(--main-accent)" stroke-width="2.5" fill="none"/><circle cx="38" cy="45" r="10" stroke="var(--main-accent)" stroke-width="2"/><circle cx="62" cy="45" r="10" stroke="var(--main-accent)" stroke-width="2"/><circle cx="38" cy="45" r="3" fill="var(--main-accent)"/><circle cx="62" cy="45" r="3" fill="var(--main-accent)"/><polygon points="50,55 44,68 56,68" stroke="var(--main-accent)" stroke-width="2" fill="var(--amber-glow)"/>`
        },
        {
            theme: 'forest',
            name: 'GÜÇ & KARARLILIK (LUPUS)',
            svg: `<polygon points="50,20 30,45 38,50 25,75 42,65 50,90 58,65 75,75 62,50 70,45" stroke="var(--main-accent)" stroke-width="2.5" fill="var(--amber-glow)" stroke-linejoin="round"/><circle cx="42" cy="48" r="2" fill="var(--main-accent)"/><circle cx="58" cy="48" r="2" fill="var(--main-accent)"/>`
        }
    ];

    let currentModeIdx = 0;
    let currentCategory = 'all';
    let isEditor = false;
    let activeEditorTab = 'text';
    let loadedImageBase64 = "";
    const PASS = "yigit1907";

    function cycleTheme() {
        currentModeIdx = (currentModeIdx + 1) % symbolModes.length;
        const mode = symbolModes[currentModeIdx];
        document.documentElement.setAttribute('data-theme', mode.theme);
        document.getElementById('totemSvg').innerHTML = mode.svg;
        document.getElementById('modeSubText').innerText = mode.name;
        localStorage.setItem('yigit_mode_idx', currentModeIdx);
    }

    function loadSavedTheme() {
        const saved = localStorage.getItem('yigit_mode_idx');
        if (saved !== null) {
            currentModeIdx = parseInt(saved);
            const mode = symbolModes[currentModeIdx];
            document.documentElement.setAttribute('data-theme', mode.theme);
            document.getElementById('totemSvg').innerHTML = mode.svg;
            document.getElementById('modeSubText').innerText = mode.name;
        }
    }

    function loadData(key, fallback) {
        const val = localStorage.getItem(key);
        return val ? JSON.parse(val) : fallback;
    }

    function saveData(key, val) {
        localStorage.setItem(key, JSON.stringify(val));
    }

    function parseMarkdown(txt) {
        if (!txt) return '';
        return txt
            .replace(/^# (.*$)/gm, '<h2 style="color:var(--text-main); margin:10px 0;">$1</h2>')
            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
            .replace(/> (.*$)/gm, '<blockquote style="border-left:3px solid var(--main-accent); padding-left:12px; margin:10px 0; font-style:italic; color:var(--main-accent);">$1</blockquote>');
    }

    function renderManifesto() {
        const txt = loadData('yigit_manifesto', defaultManifesto);
        document.getElementById('aboutDisplay').innerHTML = parseMarkdown(txt);
    }

    function editAbout() {
        const current = loadData('yigit_manifesto', defaultManifesto);
        const updated = prompt("Manifestonuzu Düzenleyin:", current);
        if (updated !== null && updated.trim() !== "") {
            saveData('yigit_manifesto', updated);
            renderManifesto();
        }
    }

    // EDİTÖR SEKMELERİ VE KALEM MODU LOGİĞİ
    function switchEditorTab(tab) {
        activeEditorTab = tab;
        document.getElementById('tabTextBtn').classList.toggle('active', tab === 'text');
        document.getElementById('tabDrawBtn').classList.toggle('active', tab === 'draw');
        document.getElementById('textModeArea').style.display = tab === 'text' ? 'block' : 'none';
        document.getElementById('drawModeArea').style.display = tab === 'draw' ? 'flex' : 'none';
        if(tab === 'draw') initDrawingCanvas();
    }

    let canvas, ctxDrawing, isDrawing = false;
    function initDrawingCanvas() {
        canvas = document.getElementById('drawCanvas');
        ctxDrawing = canvas.getContext('2d');
        ctxDrawing.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--main-accent').trim() || "#e5b869";
        ctxDrawing.lineWidth = 3;
        ctxDrawing.lineCap = 'round';

        function startDraw(e) { isDrawing = true; draw(e); }
        function stopDraw() { isDrawing = false; ctxDrawing.beginPath(); }
        function draw(e) {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
            const y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;
            ctxDrawing.lineTo(x, y);
            ctxDrawing.stroke();
            ctxDrawing.beginPath();
            ctxDrawing.moveTo(x, y);
        }

        canvas.onmousedown = startDraw; canvas.onmouseup = stopDraw; canvas.onmousemove = draw;
        canvas.ontouchstart = startDraw; canvas.ontouchend = stopDraw; canvas.ontouchmove = draw;
    }

    function clearCanvas() {
        if(ctxDrawing) ctxDrawing.clearRect(0, 0, canvas.width, canvas.height);
    }

    function handleFileSelect(evt) {
        const file = evt.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) { loadedImageBase64 = e.target.result; };
            reader.readAsDataURL(file);
        }
    }

    function renderNotes() {
        const notes = loadData('yigit_notes', initialNotes);
        const grid = document.getElementById('notesGrid');
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        grid.innerHTML = '';

        notes.forEach((n, idx) => {
            if (currentCategory !== 'all' && n.cat !== currentCategory) return;
            const combinedText = (n.title + " " + n.content).toLowerCase();
            if (searchTerm && !combinedText.includes(searchTerm)) return;

            const card = document.createElement('div');
            card.className = 'card reveal-on-scroll';
            card.innerHTML = `
                <div>
                    <div class="card-tag">// ${n.cat}</div>
                    ${n.title ? `<div class="card-title">${n.title}</div>` : ''}
                    ${n.img ? `<img src="${n.img}" class="card-img" alt="Görsel">` : ''}
                    <div class="card-body">${parseMarkdown(n.content)}</div>
                </div>
                <div class="card-foot">
                    <span>📜 ${n.date}</span>
                    ${isEditor ? `<button class="btn-del" onclick="deleteNote(${n.id})">Sil 🗑️</button>` : ''}
                </div>
            `;
            grid.appendChild(card);
        });

        observeElements();
    }

    function addNote() {
        const title = document.getElementById('newTitle').value.trim();
        const cat = document.getElementById('newCat').value;
        let content = document.getElementById('newContent').value.trim();
        let finalImg = loadedImageBase64 || document.getElementById('imgUrlInput').value.trim();

        if (activeEditorTab === 'draw') {
            finalImg = canvas.toDataURL();
            if (!content) content = "✏️ *El Yazısı / Çizim Notu*";
        }

        if (!content && !finalImg) {
            alert('Lütfen bir metin yazın, resim ekleyin veya çizim yapın.');
            return;
        }

        const notes = loadData('yigit_notes', initialNotes);
        notes.unshift({
            id: Date.now(),
            title: title || (cat === "Yiğit'in Defteri" ? "Yiğit'in Defteri Notu" : "İsimsiz Not"),
            cat: cat,
            date: new Date().toISOString().split('T')[0],
            content: content,
            img: finalImg
        });

        saveData('yigit_notes', notes);
        document.getElementById('newTitle').value = '';
        document.getElementById('newContent').value = '';
        document.getElementById('imgUrlInput').value = '';
        loadedImageBase64 = "";
        clearCanvas();
        renderNotes();
        alert('Not başarıyla tapınağa kaydedildi!');
    }

    function deleteNote(id) {
        if (confirm('Bu içeriği silmek istediğinden emin misin?')) {
            let notes = loadData('yigit_notes', initialNotes);
            notes = notes.filter(n => n.id !== id);
            saveData('yigit_notes', notes);
            renderNotes();
        }
    }

    function filterNotes(cat, btn) {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCategory = cat;
        renderNotes();
    }

    function toggleAuth() {
        if (!isEditor) {
            const p = prompt("Editör Şifresini Girin:");
            if (p === PASS) {
                isEditor = true;
                document.getElementById('statusText').innerText = "👑 Editör Modu (Yiğit)";
                document.getElementById('authBtn').innerText = "🚪 Çıkış Yap";
                document.getElementById('editorPanel').classList.add('active');
                document.getElementById('editAboutBtn').style.display = 'inline';
                renderNotes();
            } else if (p !== null) alert("Hatalı şifre!");
        } else {
            isEditor = false;
            document.getElementById('statusText').innerText = "🌐 Ziyaretçi Modu";
            document.getElementById('authBtn').innerText = "🔐 Editör Girişi";
            document.getElementById('editorPanel').classList.remove('active');
            document.getElementById('editAboutBtn').style.display = 'none';
            renderNotes();
        }
    }

    function observeElements() {
        const observer = new IntersectionObserver((entries, obs) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('revealed');
                    obs.unobserve(entry.target);
                }
            });
        }, { threshold: 0.08 });

        document.querySelectorAll('.reveal-on-scroll:not(.revealed)').forEach(el => observer.observe(el));
    }

    window.addEventListener('scroll', () => {
        const scrollTop = window.scrollY;
        const docHeight = document.documentElement.scrollHeight - window.innerHeight;
        document.getElementById('scrollProgress').style.height = `${(scrollTop / docHeight) * 100}%`;
        document.getElementById('templeSvg').style.transform = `translateX(-50%) translateY(${scrollTop * 0.18}px)`;
        document.getElementById('fgColumns').style.transform = `translateY(${scrollTop * 0.4}px)`;
    });

    function initStars() {
        const canvas = document.getElementById('starCanvas');
        const ctx = canvas.getContext('2d');
        let w = canvas.width = window.innerWidth, h = canvas.height = window.innerHeight;
        const stars = Array.from({length: 80}, () => ({ x: Math.random()*w, y: Math.random()*h*0.7, r: Math.random()*1.2+0.3, a: Math.random() }));

        function draw() {
            ctx.clearRect(0, 0, w, h);
            stars.forEach(s => {
                ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
                ctx.fillStyle = `rgba(255, 255, 255, ${s.a})`; ctx.fill();
            });
            requestAnimationFrame(draw);
        }
        draw();
    }

    function initGoldDust() {
        const canvas = document.getElementById('goldDustCanvas');
        const ctx = canvas.getContext('2d');
        let w = canvas.width = window.innerWidth, h = canvas.height = window.innerHeight;
        const dust = Array.from({length: 45}, () => ({ x: Math.random()*w, y: Math.random()*h, r: Math.random()*1.8+0.5, sy: Math.random()*0.3+0.1 }));

        function animate() {
            ctx.clearRect(0, 0, w, h);
            const color = getComputedStyle(document.documentElement).getPropertyValue('--main-accent').trim() || "#e5b869";
            dust.forEach(d => {
                d.y -= d.sy; if (d.y < 0) d.y = h;
                ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI*2);
                ctx.fillStyle = color; ctx.fill();
            });
            requestAnimationFrame(animate);
        }
        animate();
    }

    window.onload = () => {
        loadSavedTheme();
        renderManifesto();
        renderNotes();
        initStars();
        initGoldDust();
        observeElements();
    };
</script>
</body>
</html>
